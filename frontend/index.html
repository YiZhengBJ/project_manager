<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目管理</title>
<link rel="stylesheet" href="styles.css"></head><body>
<div class="app"><aside class="sidebar"><div class="workspace">▣ &nbsp; 产品研发工作空间</div><div class="label">WORKSPACE</div><button class="nav active" data-view="map">◈ &nbsp; 项目概览</button><button class="nav" data-view="daily">☷ &nbsp; 每日 TODO <small id="sidebar-count"></small></button><button class="nav" data-view="table">▤ &nbsp; 任务表格</button><div class="projects-heading"><div class="label">PROJECTS</div><button id="new-project" aria-label="新建项目" title="新建项目">＋</button></div><div id="project-list"></div></aside>
<main class="main"><div class="content"><div class="tabsbar"><div class="tabs"><button class="tab active" data-view="map">◈ &nbsp; 事项脑图</button><button class="tab" data-view="daily">☷ &nbsp; 每日 TODO</button><button class="tab" data-view="table">▤ &nbsp; 任务表格</button></div><div class="filters"><input type="date" id="day" style="border:0;background:transparent;color:#64715d;font-size:11px"><select id="person-filter" aria-label="筛选负责人"><option value="">全部负责人</option></select><button id="manage-people" class="manage-people" aria-label="新增或移除负责人">管理</button><label><input type="checkbox" id="hide-done" style="accent-color:#48734c;vertical-align:middle"> 隐藏已完成</label></div></div>
<section id="empty-projects" class="hidden"><h2>还没有项目</h2><p>新建一个项目，开始拆解事项。</p><button class="btn primary" id="empty-new-project">＋ 新建项目</button></section><section id="map-view" class="view"><div class="canvas-panel"><div class="panel-head"><strong>项目事项结构</strong><span>滚轮缩放 · 按住左键拖动 · 点击节点编辑</span></div><div class="canvas"><div id="map" class="map"></div></div><div class="canvas-footer"><div class="legend"><span><i style="background:#d9decf"></i>未进行</span><span><i></i>进行中</span><span><i class="gray"></i>已完成</span></div><div class="zoom"><button id="center-map" aria-label="居中并显示全部节点">⊙ 居中</button><button id="zoom-out" aria-label="缩小">−</button><span id="zoom-label">100%</span><button id="zoom-in" aria-label="放大">＋</button></div></div><div id="canvas-resize" role="separator" tabindex="0" aria-label="调整画布高度" aria-orientation="horizontal" title="拖动底边调整画布高度"><i></i></div></div><aside class="detail hidden" id="detail"></aside></section>
<section id="table-view" class="hidden"><div class="table-panel"><div class="panel-head"><strong>叶子任务总表</strong><div class="table-toolbar"><span id="table-count"></span><button class="btn export-excel" id="export-excel">导出 Excel</button><details id="column-settings"><summary>设置</summary><div class="column-menu"><div class="table-status-settings"><label><input type="checkbox" id="table-hide-inactive"> 隐藏未进行</label><label><input type="checkbox" id="table-hide-complete"> 隐藏已完成</label></div><div class="column-menu-head">显示列 <button type="button" id="show-all-columns">全部显示</button></div><div id="column-options"></div></div></details></div></div><div class="task-table-scroll"><table class="task-table" id="task-table"></table></div></div></section><div class="intro" style="justify-content:flex-end"><button class="btn primary" id="new-node">＋ 新建事项</button></div>
<div class="stats"><div class="stat"><div class="stat-top">项目事项 <span>▤</span></div><div class="stat-number" id="stat-tasks"></div></div><div class="stat"><div class="stat-top">当日 TODO <span>☷</span></div><div class="stat-number" id="stat-todo"></div></div><div class="stat"><div class="stat-top">参与成员 <span>♧</span></div><div class="stat-number" id="stat-members"></div></div></div>
<section id="daily-view" class="daily-layout hidden"><div id="people-list"></div><aside class="text-panel"><h3>纯文本日报</h3><textarea id="report" aria-label="纯文本日报" readonly></textarea><button id="copy-all" class="btn primary">▣ &nbsp; 复制当前日报</button><p class="note">[x] 表示 TODO 已完成；昨日展示进展，今日展示计划。</p></aside></section><div class="bottom-note"><span>v1.0</span></div></div></main></div><div class="toast" id="toast" role="status"></div>
<dialog id="new-item-dialog" aria-labelledby="new-item-heading"><form id="new-item-form"><div class="modal-head"><h2 id="new-item-heading">新建事项</h2><button type="button" id="new-item-close" aria-label="关闭新建事项">×</button></div><div class="field"><label for="new-item-title">事项名称</label><input type="text" id="new-item-title" placeholder="输入事项名称" maxlength="60" required></div><div class="field"><label for="new-item-parent">上级事项</label><select id="new-item-parent"></select></div><div class="field"><label for="new-item-owner">负责人</label><select id="new-item-owner"></select></div><div class="modal-actions"><button type="button" class="btn" id="new-item-cancel">取消</button><button type="submit" class="btn primary">创建事项</button></div></form></dialog>
<dialog id="people-dialog" aria-labelledby="people-heading"><div class="modal-head"><h2 id="people-heading">管理负责人</h2><button type="button" id="people-close" aria-label="关闭负责人管理">×</button></div><form id="add-person-form"><div class="add-person-row"><input id="person-name" type="text" placeholder="输入新负责人姓名" maxlength="20" required aria-label="新负责人姓名"><button class="btn primary" type="submit">＋ 新增</button></div></form><div id="people-members"></div><p class="people-hint">有事项的负责人移除时，事项将转交给所选负责人。</p></dialog>
<dialog id="project-dialog" aria-labelledby="project-heading"><form id="project-form"><div class="modal-head"><h2 id="project-heading">新建项目</h2><button type="button" id="project-close" aria-label="关闭新建项目">×</button></div><div class="field"><label for="project-name">项目名称</label><input id="project-name" type="text" maxlength="60" required placeholder="输入项目名称"></div><div class="field"><label for="project-owner">项目负责人</label><select id="project-owner"></select></div><div class="modal-actions"><button type="button" class="btn" id="project-cancel">取消</button><button class="btn primary" type="submit">创建项目</button></div></form></dialog><dialog id="delete-project-dialog" aria-labelledby="delete-project-heading"><div class="modal-head"><h2 id="delete-project-heading">删除项目</h2></div><p id="delete-project-message" style="margin-top:20px"></p><div class="modal-actions"><button class="btn" id="delete-project-cancel">取消</button><button class="btn primary" id="delete-project-confirm" style="background:#a76655;border-color:#a76655">删除项目</button></div></dialog>
<dialog id="table-todo-dialog" aria-labelledby="table-todo-heading"><form id="table-todo-form"><div class="modal-head"><h2 id="table-todo-heading">新增今日 TODO</h2><button type="button" id="table-todo-close" aria-label="关闭今日 TODO">×</button></div><p id="table-todo-task"></p><div class="field"><label for="table-todo-date">日期</label><input type="text" id="table-todo-date" readonly></div><div class="field"><label for="table-todo-text">TODO</label><textarea id="table-todo-text" required placeholder="填写今日 TODO"></textarea></div><div class="field"><label for="table-todo-note">进展</label><textarea id="table-todo-note" placeholder="填写进展（可选）"></textarea></div><div class="modal-actions"><button type="button" class="btn" id="table-todo-cancel">取消</button><button type="submit" class="btn primary" id="table-todo-save">保存</button></div></form></dialog><dialog id="item-owners-dialog" aria-labelledby="item-owners-heading"><form id="item-owners-form"><div class="modal-head"><h2 id="item-owners-heading">编辑负责人</h2><button type="button" id="item-owners-close" aria-label="关闭事项负责人编辑">×</button></div><p id="item-owners-title"></p><div id="item-owner-options"></div><div class="modal-actions"><button type="button" class="btn" id="item-owners-cancel">取消</button><button type="submit" class="btn primary">保存负责人</button></div></form></dialog><script src="excel.js" defer></script><script src="desktop.js" defer></script><script src="app.js" defer></script></body></html>
